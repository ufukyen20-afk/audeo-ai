/* Masaüstü Sol Sidebar */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 80px;
  height: 100vh;
  background-color: var(--bg-surface);
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  z-index: 1000;
  transition: transform 0.3s ease;
}

.sidebar.collapsed {
  transform: translateX(-100%);
}

.sidebar-toggle-btn {
  background: none;
  border: none;
  color: var(--text-main);
  font-size: 1.2rem;
  cursor: pointer;
  margin-bottom: 20px;

}

.sidebar-item:hover, .sidebar-item.active {

/* Masaüstü Gizliyken Ortada Çıkan Açma Butonu */

<script>
document.addEventListener('DOMContentLoaded', () => {
  const desktopSidebar = document.getElementById('desktopSidebar');
  const mainWrapper = document.querySelector('.main-wrapper');
  const desktopToggleBtn = document.getElementById('desktopToggleBtn');
  const desktopOpenBtn = document.getElementById('desktopOpenBtn');

  // --- MASAÜSTÜ SIDEBAR TOGGLE ---
  function toggleDesktopSidebar() {
    desktopSidebar.classList.toggle('collapsed');
    mainWrapper.classList.toggle('full-width');

    if (desktopSidebar.classList.contains('collapsed')) {
      desktopOpenBtn.style.display = 'block';
    } else {
      desktopOpenBtn.style.display = 'none';
    }
  }

  if (desktopToggleBtn) desktopToggleBtn.addEventListener('click', toggleDesktopSidebar);
  if (desktopOpenBtn) desktopOpenBtn.addEventListener('click', toggleDesktopSidebar);
            // --- MOBİL MENÜ TOGGLE ---
    const mobileHamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileMenuOverlay = document.getElementById('mobileOverlay');


    if (mobileHamburgerBtn && mobileMenuOverlay) {
      mobileHamburgerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        mobileMenuOverlay.classList.toggle('active');
      });
    }



});


    const urlInput = document.getElementById('videoUrl');

async function kaliteyiOtomatikSaptar(url) {
    if (!url) return;

    const kaliteKutusu = document.getElementById('videoKalitesi');
    const durumMetni = document.getElementById('durumMetni');
    const durum = document.getElementById('durum');

    try {
        if (durum) durum.classList.remove('d-none');
        if (durumMetni) durumMetni.innerText = "Video kalitesi kontrol ediliyor...";

        const response = await fetch(`/info?url=${encodeURIComponent(url)}`);
        if (!response.ok) throw new Error("Bilgi alınamadı");

        const data = await response.json();
        const maxH = data.max_height;

        let hedefKalite = 'en_yuksek';
        if (maxH >= 2160) hedefKalite = '2160p';
        else if (maxH >= 1440) hedefKalite = '1440p';
        else if (maxH >= 1080) hedefKalite = '1080p';
        else if (maxH >= 720) hedefKalite = '720p';
        else if (maxH >= 480) hedefKalite = '480p';
        else if (maxH >= 360) hedefKalite = '360p';

        if (kaliteKutusu) {
            kaliteKutusu.value = hedefKalite;
        }

        if (durumMetni) durumMetni.innerText = `En yüksek kalite tespit edildi: ${maxH}p`;
        if (durum) setTimeout(() => durum.classList.add('d-none'), 3000);
    } catch (err) {
        if (durum) durum.classList.add('d-none');
        console.log("Kalite bilgisi çekilemedi:", err);
    }
}







function formatDegisti() {
    const format = document.getElementById('formatTipi').value;
    const kaliteKutusu = document.getElementById('kaliteKutusu');
    
    if (format === 'mp3') {
        kaliteKutusu.style.display = 'none';
    } else {
        kaliteKutusu.style.display = 'block';
    }
}


document.getElementById('downloadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const url = document.getElementById('videoUrl').value;
    const format = document.getElementById('formatTipi').value;
    const kalite = document.getElementById('videoKalitesi').value;
    
    const durum = document.getElementById('durum');
    const durumMetni = document.getElementById('durumMetni');
    const indirBtn = document.getElementById('indirBtn');
    const progressBar = document.getElementById('progressBar');
    
    durum.classList.remove('d-none');
    indirBtn.disabled = true;
    progressBar.style.width = '0%';
    durumMetni.innerText = "İndirme başlatıldı (%0)...";
          indirBtn.classList.remove('btn-success-custom');
      indirBtn.classList.add('btn-custom');



    let apiUrl = `/download?url=${encodeURIComponent(url)}&format_tipi=${format}`;
    if (format === 'mp4') {
        apiUrl += `&video_kalitesi=${kalite}`;
    }

    try {
        const response = await fetch(apiUrl, { method: 'POST' });
        if (!response.ok) throw new Error('İndirme sırasında bir hata oluştu.');

        const reader = response.body.getReader();
        const contentLength = +response.headers.get('Content-Length');
        let receivedLength = 0;
        let chunks = [];

        while(true) {
            const {done, value} = await reader.read();
            if (done) break;

            chunks.push(value);
            receivedLength += value.length;

            if (contentLength) {
                const yuzde = Math.round((receivedLength / contentLength) * 100);
                progressBar.style.width = `${yuzde}%`;
                durumMetni.innerText = `İndiriliyor: %${yuzde}`;
            }
        }

              // Seçilen formata göre uzantı ve medya türünü belirle
      const uzanti = format === 'mp3' ? '.mp3' : '.mp4';
      const mimeType = format === 'mp3' ? 'audio/mpeg' : 'video/mp4';

      const blob = new Blob(chunks, { type: mimeType });
      const downloadUrl = window.URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = downloadUrl;

            // Sunucudan gelen başlığı kontrol et
      const contentDisposition = response.headers.get('Content-Disposition');
      let filename = `indirilen_medya${uzanti}`;


      if (contentDisposition) {
        const match = contentDisposition.match(/filename\*?=(?:UTF-8'')?["']?([^"';]+)["']?/i);
        if (match && match[1]) {
          let extracted = decodeURIComponent(match[1]).trim();
          if (!extracted.endsWith('.mp4') && !extracted.endsWith('.mp3')) {
            extracted += uzanti;
          }
          filename = extracted;
        }
      }



      a.download = filename;


      document.body.appendChild(a);
      a.click();
      a.remove();

              // İndirme bittiğinde yeşil yap
      indirBtn.classList.remove('btn-custom');
      indirBtn.classList.add('btn-success-custom');
      durumMetni.innerText = "İndirme tamamlandı! Dosyanız kaydedildi.";

      // Kaydet penceresi açıldıktan 3 saniye sonra eski haline döndür
      setTimeout(() => {
        indirBtn.classList.remove('btn-success-custom');
        indirBtn.classList.add('btn-custom');
        durumMetni.innerText = "";
      }, 3000);

    } catch (err) {
        durumMetni.innerText = "Hata: " + err.message;
    } finally {
        indirBtn.disabled = false;
    }
});

// Güvenli LUT Matrisi Çekme Fonksiyonu
async function loadProtectedLUT(lutName) {
    try {
        const response = await fetch(`/api/lut/${lutName}`);
        const lutData = await response.json();

        if (lutData.error) {
            console.error("LUT Yükleme Hatası:", lutData.error);
            return null;
        }

        console.log("LUT Matrisi Başarıyla Alındı:", lutData.title);
        return lutData;

    } catch (error) {
        console.error("Ağ İletişim Hatası:", error);
        return null;
    }
}

   // FFmpeg Motoru Başlatma Mantığı (v0.11.6 ST Sürüm Uyumlu)
  const { createFFmpeg } = FFmpeg;
  const ffmpeg = createFFmpeg({ 
    log: true,
    mainName: 'main',
    corePath: 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js'
  });


  async function loadFFmpeg() {
    if (!ffmpeg.isLoaded()) {
      console.log("FFmpeg motoru yükleniyor...");
      await ffmpeg.load();
      console.log("FFmpeg motoru hazır!");
    }
  }


  window.addEventListener('DOMContentLoaded', loadFFmpeg);

// Medya İşleme ve Dönüştürme Fonksiyonu
async function processMedia(fileBlob, outputFileName, ffmpegArgs) {
  if (!ffmpeg.isLoaded()) {
    await loadFFmpeg();
  }

  const inputFileName = 'input_media';
  
  // 1. Dosyayı Blob'dan Uint8Array'e çevirip FFmpeg sanal belleğine yaz
  const fileData = new Uint8Array(await fileBlob.arrayBuffer());
  ffmpeg.FS('writeFile', inputFileName, fileData);

  console.log("İşlem başlatılıyor, komut:", ffmpegArgs);

  // 2. FFmpeg komutunu çalıştır (örnek: -i input_media -ss 00:00:00 -t 10 output.mp4)
  await ffmpeg.run('-i', inputFileName, ...ffmpegArgs, outputFileName);

  // 3. İşlenmiş dosyayı sanal bellekten oku
  const data = ffmpeg.FS('readFile', outputFileName);

  // 4. Belleği temizle
  ffmpeg.FS('unlink', inputFileName);
  ffmpeg.FS('unlink', outputFileName);

  // 5. İşlenmiş dosyayı indirilebilir Blob URL'e çevir ve döndür
  return URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
}
// 1. Girdi Kaynağını Yakalama ve Belleğe Alma
async function getMediaBlob(sourceType, sourceData) {
  if (sourceType === 'url') {
    // URL üzerinden gelen medyayı indirip Blob'a dönüştürür
    const response = await fetch(sourceData);
    if (!response.ok) throw new Error("Medyayı indirme başarısız oldu.");
    return await response.blob();
  } 
  else if (sourceType === 'file') {
    // Cihazdan seçilen dosyayı doğrudan Blob/File olarak döndürür
    return sourceData; 
  }
}

// 2. Arayüz Parametrelerinden FFmpeg Komutu Oluşturma
function buildFFmpegArgs(options = {}) {
  const { startTime, endTime, volumeBoost, outputFormat = 'mp4' } = options;
  const args = [];


  // Başlangıç zamanı (-ss 00:00:05 veya saniye cinsinden)
  if (startTime) {
    args.push('-ss', startTime.toString());
  }


  // Bitiş / Süre (-t 10)
  if (endTime) {
    args.push('-t', endTime.toString());
  }


  // Ses yükseltme filtresi (-filter:a "volume=1.5")
  if (volumeBoost && volumeBoost !== '1.0' && outputFormat !== 'gif') {
    args.push('-filter:a', `volume=${volumeBoost}`);
  }


  // Çıktı dosya adı oluşturma (örnek: output.mp3, output.gif, output.mp4)
  const outputFileName = `output.${outputFormat}`;


  return { args, outputFileName };
}

// 3, 4 & 5. Tüm İş Akışını Birleştiren Ana Çalıştırıcı Fonksiyon
async function handleMediaPipeline(sourceType, sourceData, userOptions = {}) {
  try {
    console.log("1. Medya kaynağı alınıyor...");
    const fileBlob = await getMediaBlob(sourceType, sourceData);


    console.log("2. FFmpeg komutları hazırlanıyor...");
    const { args, outputFileName } = buildFFmpegArgs(userOptions);


    console.log("3. İşlem başlatılıyor...");
    const resultDownloadUrl = await processMedia(fileBlob, outputFileName, args);


    console.log("İşlem Başarılı! İndirme URL'i:", resultDownloadUrl);
    return resultDownloadUrl;
  } catch (error) {
    console.error("İşlem Sırasında Hata Oluştu:", error);
    throw error;
  }
}
